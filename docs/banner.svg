<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA23A"/><stop offset="0.5" stop-color="#FF7A1A"/><stop offset="1" stop-color="#EE521E"/>
    </linearGradient>
    <radialGradient id="bglow" cx="0.15" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/><stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.6" fill="#FFFFFF"/><circle cx="19" cy="15" r="2.6" fill="#FFFFFF"/>
    </pattern>
    <linearGradient id="bfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.22"/>
    </linearGradient>
    <mask id="bmask"><rect width="1280" height="400" fill="url(#bfade)"/></mask>
    <filter id="bsh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1280" height="400" fill="url(#bbg)"/>
  <rect width="1280" height="400" fill="url(#bglow)"/>
  <rect width="1280" height="400" fill="url(#bdots)" mask="url(#bmask)"/>
  <rect x="62" y="76" width="262" height="262" rx="60" transform="translate(19 0)" fill="#8A2A00" opacity="0.35" filter="url(#bsh)"/>
  <svg x="50" y="50" width="300" height="300" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFA23A"/>
      <stop offset="0.55" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#F0561E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FBFCFE"/>
      <stop offset="1" stop-color="#DCE2EA"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9A33"/>
      <stop offset="1" stop-color="#E9561A"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5DCE5"/>
    </linearGradient>
    <clipPath id="bodyclip"><rect x="-60" y="-178" width="120" height="290" rx="60"/></clipPath>
    <clipPath id="tile"><rect x="32" y="32" width="448" height="448" rx="104"/></clipPath>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.4" fill="#FFFFFF"/>
      <circle cx="16" cy="13" r="2.4" fill="#FFFFFF"/>
    </pattern>
    <radialGradient id="dotfade" cx="0.33" cy="0.74" r="0.42">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="512" height="512" fill="url(#dotfade)"/></mask>
  </defs>

  <!-- Kachel -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#glow)"/>

  <g clip-path="url(#tile)">
    <!-- Punktraster (wie das unsichtbare Muster auf den Seiten) -->
    <rect width="512" height="512" fill="url(#dots)" mask="url(#dotmask)"/>

    <!-- Wellen beim Antippen -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <ellipse cx="168" cy="382" rx="44" ry="15" stroke-width="9" opacity="0.95"/>
      <ellipse cx="168" cy="382" rx="82" ry="28" stroke-width="8" opacity="0.6"/>
      <ellipse cx="168" cy="382" rx="122" ry="42" stroke-width="7" opacity="0.3"/>
    </g>

    <!-- Klang aus dem Lautsprecher -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" transform="translate(298 154) rotate(35)">
      <path d="M -73.7 -51.6 A 90 90 0 0 0 -73.7 51.6" stroke-width="13" opacity="0.95"/>
      <path d="M -110.6 -77.4 A 135 135 0 0 0 -110.6 77.4" stroke-width="13" opacity="0.55"/>
    </g>
    <!-- Funkeln -->
    <g fill="#FFFFFF">
      <path d="M 400 330 Q 404 348 422 352 Q 404 356 400 374 Q 396 356 378 352 Q 396 348 400 330 Z" opacity="0.9"/>
      <path d="M 430 268 Q 432 277 441 279 Q 432 281 430 290 Q 428 281 419 279 Q 428 277 430 268 Z" opacity="0.7"/>
    </g>
  </g>

  <!-- Schatten des Stifts -->
  <g transform="translate(286 236) rotate(35)" opacity="0.28" filter="url(#shadow)">
    <rect x="-52" y="-160" width="120" height="300" rx="60" fill="#7A2300"/>
  </g>

  <!-- Stift -->
  <g transform="translate(270 222) rotate(35)">
    <!-- Spitze -->
    <path d="M -46 96 L 46 96 L 15 166 Q 0 184 -15 166 Z" fill="url(#tip)"/>
    <path d="M -15 166 Q 0 184 15 166 L 9 152 L -9 152 Z" fill="url(#cap)"/>
    <circle cx="0" cy="174" r="9" fill="#2A2A2E"/>
    <!-- Körper -->
    <rect x="-60" y="-178" width="120" height="290" rx="60" fill="url(#body)"/>
    <g clip-path="url(#bodyclip)">
      <!-- orange Kappe -->
      <rect x="-70" y="-190" width="140" height="78" fill="url(#cap)"/>
      <rect x="-70" y="-114" width="140" height="7" fill="#FFFFFF" opacity="0.5"/>
      <!-- Griffzone -->
      <rect x="-70" y="62" width="140" height="56" fill="url(#cap)"/>
      <!-- Lichtkante -->
      <rect x="-42" y="-96" width="14" height="148" rx="7" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <!-- Lautsprecher -->
    <g fill="#C9D1DB">
      <circle cx="-12" cy="-80" r="5"/><circle cx="8" cy="-80" r="5"/><circle cx="28" cy="-80" r="5"/>
      <circle cx="-2" cy="-63" r="5"/><circle cx="18" cy="-63" r="5"/>
    </g>
    <!-- Taste -->
    <circle cx="8" cy="-6" r="20" fill="url(#cap)"/>
    <circle cx="8" cy="-6" r="20" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="2" cy="-12" r="5" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
  <rect x="68.8" y="68.8" width="262.5" height="262.5" rx="60.9" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>
  <text x="390" y="175" font-family="Fira Sans" font-weight="800" font-size="78" fill="#FFFFFF">tiptoi Manager</text>
  <text x="394" y="233" font-family="Fira Sans" font-weight="500" font-size="36" fill="#FFFFFF" fill-opacity="0.9">für Linux Mint · Open Source</text>
  <rect x="390" y="274" width="126" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/><text x="453" y="306" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="22" fill="#FFFFFF">Suchen</text><rect x="530" y="274" width="180" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/><text x="620" y="306" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="22" fill="#FFFFFF">Übertragen</text><rect x="724" y="274" width="167" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/><text x="808" y="306" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="22" fill="#FFFFFF">Verwalten</text>
  <text x="1244" y="374" text-anchor="end" font-family="Fira Sans" font-size="18" fill="#FFFFFF" fill-opacity="0.75">Inoffiziell · nicht mit der Ravensburger AG verbunden</text>
</svg>